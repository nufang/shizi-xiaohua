  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #2a1048;
      color: white;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      touch-action: manipulation;
      overflow: hidden;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #app { width: 100%; height: 100%; }
    .stage {
      position: relative;
      height: 100%;
      min-height: 100%;
      padding: 18px 24px 76px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #6d28d9 0%, #db2777 58%, #fbbf24 100%);
    }
    .stage::after {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: 0;
      height: 68px;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.14);
      clip-path: polygon(0 100%, 0 46%, 10% 46%, 10% 18%, 18% 18%, 18% 46%, 32% 46%, 32% 8%, 42% 8%, 42% 50%, 58% 50%, 58% 22%, 70% 22%, 70% 54%, 82% 54%, 82% 16%, 92% 16%, 92% 58%, 100% 58%, 100% 100%);
    }
    .stage > *:not(.fireworks):not(.note):not(.confetti) { position: relative; z-index: 1; }
    .split {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 18px;
      align-items: stretch;
    }
    .hero-pane {
      flex: 0 0 34%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 48px;
      letter-spacing: 2px;
      text-shadow: 0 3px 0 #7e22ce;
    }
    .hero { display: flex; justify-content: center; margin: 4px 0 8px; min-height: 0; }
    .princess { width: auto; height: min(52vh, 420px); filter: drop-shadow(0 8px 0 rgba(91, 33, 135, 0.25)); }
    .banner {
      margin: 8px 0 0;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #7c2d12;
      background: #fde68a;
      border-radius: 999px;
      padding: 8px 18px;
    }
    .doors, .wardrobe-grid { display: grid; gap: 14px; min-height: 0; min-width: 0; }
    .doors {
      flex: 1;
      overflow: auto;
      align-content: start;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: minmax(128px, auto);
    }
    .door-emoji { font-size: 52px; line-height: 1.1; }
    .door-meta { display: block; margin-top: 2px; font-size: 16px; font-weight: 700; color: #a855f7; }
    .emoji-clue { font-size: min(26vh, 200px); line-height: 1.15; }
    .wardrobe-grid {
      flex: 1;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: minmax(132px, 1fr);
      align-content: stretch;
      overflow: auto;
    }
    .door, .item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid transparent;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      color: #7e22ce;
      min-height: 0;
      font-size: 28px;
      font-weight: 800;
    }
    .door:active, .item:active, .choice:active { transform: scale(0.98); }
    .door svg, .item svg { width: 120px; height: 120px; display: block; margin: 0 auto; }
    .door-name, .item span { display: block; margin: 6px 0 0; }
    .door-name { font-size: 20px; line-height: 1.25; }
    .star {
      position: absolute;
      top: 6px;
      right: 10px;
      color: #f59e0b;
      font-size: 26px;
      line-height: 1;
    }
    .quiz-top { display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
    .quiz-top .level-name { margin: 0; flex: 1; text-align: left; }
    .back {
      min-height: 48px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.18);
      color: white;
      font-size: 18px;
      font-weight: 700;
    }
    .dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); }
    .dot.on, .dot.now { background: #fde68a; }
    .dot.now { box-shadow: 0 0 0 3px rgba(253, 230, 138, 0.45); }
    .level-name { text-align: center; margin: 10px 0; font-size: 22px; font-weight: 700; }
    .quiz-body {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 16px;
      margin-top: 12px;
    }
    .picture-card {
      flex: 1.15;
      background: white;
      border-radius: 28px;
      min-height: 0;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 0 rgba(126, 34, 206, 0.25);
    }
    .picture-card svg { width: min(50vh, 420px); height: min(50vh, 420px); }
    .picture-card.right { box-shadow: 0 0 0 5px #fde68a, 0 10px 0 rgba(126, 34, 206, 0.25); }
    .choices {
      flex: 0.85;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice {
      flex: 1;
      min-height: 0;
      border-radius: 22px;
      border: 3px solid rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-size: 72px;
      font-weight: 800;
    }
    .choice.right { background: #fde68a; color: #7e22ce; border-color: #fde68a; }
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .item.worn { border-color: #fbbf24; box-shadow: 0 0 0 3px #fde68a; }
    .note {
      position: absolute;
      right: 18px;
      bottom: 10px;
      z-index: 3;
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      text-align: right;
      color: rgba(255, 255, 255, 0.92);
    }
    @media (max-width: 800px), (orientation: portrait) {
      .split, .quiz-body { flex-direction: column; }
      .hero-pane { flex: 0 0 auto; }
      .princess { height: min(28vh, 220px); }
      h1 { font-size: 36px; }
      .doors { grid-template-columns: repeat(3, 1fr); }
      .door, .item { min-height: 96px; font-size: 22px; }
      .door svg, .item svg { width: 64px; height: 64px; }
      .choice { font-size: 48px; min-height: 72px; }
      .picture-card { min-height: 180px; }
      .picture-card svg { width: 180px; height: 180px; }
      .stage { overflow: auto; }
      body { overflow: auto; }
    }
    .fireworks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
    .spark {
      position: absolute;
      bottom: 90px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: rise 1.8s ease-in infinite;
    }
    @keyframes rise {
      0% { transform: translateY(20px) scale(0.4); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-240px) scale(1); opacity: 0; }
    }
    .confetti {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      left: 50%;
      top: 38%;
      line-height: 1;
      animation: petal-fall 1.7s ease-out forwards;
    }
    @keyframes petal-fall {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 0; }
      12% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shake, .spark, .petal { animation: none; }
      .petal { opacity: 0; }
    }
  </style>

      "petal-skirt": '<path d="M80 108 L66 142 H94 Z" fill="#fecdd3"/><ellipse cx="58" cy="176" rx="18" ry="24" fill="#fb7185"/><ellipse cx="80" cy="182" rx="18" ry="24" fill="#fda4af"/><ellipse cx="102" cy="176" rx="18" ry="24" fill="#fb7185"/>',
      "candy-skirt": '<path d="M80 108 L62 196 Q80 210 98 196 Z" fill="#f9a8d4"/><path d="M66 150 h28 M64 168 h32" stroke="#fff" stroke-width="6"/>',
      "princess-skirt": '<path d="M80 108 L48 198 Q80 214 112 198 Z" fill="#c4b5fd" stroke="#fbbf24" stroke-width="4"/>'
    };

    const HAIR_ART = {
      "cat-ears": '<polygon points="52,58 62,28 72,58" fill="#f9a8d4"/><polygon points="88,58 98,28 108,58" fill="#f9a8d4"/>',
      "bow": '<ellipse cx="108" cy="78" rx="14" ry="10" fill="#fb7185"/><ellipse cx="128" cy="78" rx="12" ry="9" fill="#fb7185"/><circle cx="116" cy="78" r="5" fill="#be123c"/>',
      "flower-crown": '<circle cx="58" cy="46" r="7" fill="#f9a8d4"/><circle cx="80" cy="36" r="8" fill="#fb7185"/><circle cx="102" cy="46" r="7" fill="#f9a8d4"/>',
      "pink-clip": '<rect x="96" y="62" width="28" height="8" rx="4" fill="#f9a8d4"/><circle cx="120" cy="66" r="6" fill="#fb7185"/>',
      "strawberry-clip": '<path d="M112 52 q10 6 8 16 q-3 8 -8 8 q-5 0 -8 -8 q-2 -10 8 -16 z" fill="#e11d48"/>',
      "cherry-clip": '<circle cx="108" cy="70" r="7" fill="#dc2626"/><circle cx="122" cy="70" r="7" fill="#ef4444"/>',
      "crown": '<path d="M54 58 l10 -24 16 16 16 -16 10 24 z" fill="#fbbf24"/>',
      "ribbon": '<path d="M108 62 l16 12 -16 6 -16 -6 z" fill="#f472b6"/><path d="M100 74 l-4 18 10 -6 z" fill="#fb7185"/>'
    };

    let progress = emptyProgress();
    const session = {
      screen: "home",
      categoryId: null,
      levelId: null,
      queue: [],
      qIndex: 0,
      locked: false,
      speechMissing: false,
      quizEpoch: 0
    };
    let speechToken = 0;
    let app = null;

    function petals() {
      let shapes = "";
      for (let i = 0; i < 10; i += 1) {
        const angle = (Math.PI * 2 * i) / 10;
        const x = 60 + Math.cos(angle) * 22;
        const y = 62 + Math.sin(angle) * 22;
        shapes += '<ellipse cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" rx="8" ry="14" transform="rotate(' + (i * 36) + ' ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
      }
      return shapes;
    }

    function person(color, kind) {
      const scale = kind === "small" || kind === "pigtails" ? 0.82 : 1;
      const y = kind === "small" || kind === "pigtails" ? 18 : 0;
      let hair = '<ellipse cx="60" cy="48" rx="16" ry="14" fill="#7c4a32"/>';
      if (kind === "bun" || kind === "grandma") hair += '<circle cx="60" cy="30" r="8" fill="#7c4a32"/>';
      if (kind === "grandma") hair = '<ellipse cx="60" cy="48" rx="16" ry="14" fill="#d6d3d1"/><circle cx="60" cy="30" r="8" fill="#d6d3d1"/>';
      if (kind === "pony") hair += '<path d="M74 46 q16 10 8 28" stroke="#7c4a32" stroke-width="6" fill="none"/>';
      if (kind === "pigtails") hair += '<circle cx="40" cy="58" r="6" fill="#7c4a32"/><circle cx="80" cy="58" r="6" fill="#7c4a32"/>';
      if (kind === "grandpa") hair = '<ellipse cx="60" cy="48" rx="16" ry="12" fill="#e7e5e4"/><path d="M50 70 q10 14 20 0" fill="#d6d3d1"/>';
      if (kind === "short") hair = '<ellipse cx="60" cy="46" rx="16" ry="10" fill="#44403c"/>';
      const glasses = kind === "grandma" ? '<path d="M50 52 h8 M62 52 h8" stroke="#334155" stroke-width="2"/>' : "";
      return '<g transform="translate(0 ' + y + ') scale(' + scale + ')">' + hair + '<circle cx="60" cy="52" r="14" fill="#fdba74"/>' + glasses + '<path d="M60 70 l18 28 h-36 z" fill="' + color + '"/></g>';
    }

    function emptyProgress() {
      return {
        clearedLevels: [],
        ownedItemIds: [],
        equipped: { hair: null, dress: null },
        wardrobePending: false
      };
    }

    function allItems() {
      return REWARDS;
    }

    function findLevel(id) {
      return LEVELS.filter(function (level) { return level.id === id; })[0] || null;
    }

    function findItem(id) {
      return allItems().filter(function (item) { return item.id === id; })[0] || null;
    }

    function loadProgress() {
      const blank = emptyProgress();
      let rawText = null;
      try {
        rawText = localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        return blank;
      }
      if (!rawText) return blank;
      let raw;
      try {
        raw = JSON.parse(rawText);
      } catch (error) {
        return blank;
      }
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) return blank;
      const levelIds = LEVELS.map(function (level) { return level.id; });
      const items = allItems();
      const cleared = Array.isArray(raw.clearedLevels) ? raw.clearedLevels.filter(function (id) { return levelIds.indexOf(id) !== -1; }) : [];
      const owned = Array.isArray(raw.ownedItemIds) ? raw.ownedItemIds.filter(function (id) { return !!findItem(id); }) : [];
      const equipped = { hair: null, dress: null };
      const savedEquip = raw.equipped || {};
      ["hair", "dress"].forEach(function (slot) {
        const item = findItem(savedEquip[slot]);
        if (item && item.slot === slot && owned.indexOf(item.id) !== -1) equipped[slot] = item.id;
      });
      const unique = function (list) {
        return list.filter(function (id, index) { return list.indexOf(id) === index; });
      };
      return {
        clearedLevels: unique(cleared),
        ownedItemIds: unique(owned),
        equipped: equipped,
        wardrobePending: raw.wardrobePending === true && owned.length > 0
      };
    }

    function saveProgress(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        return;
      }
    }

    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const swap = copy[i];
        copy[i] = copy[j];
        copy[j] = swap;
      }
      return copy;
    }

    function makeOptions(level, answer) {
      const rest = shuffle(level.chars.filter(function (item) { return item.char !== answer.char; }));
      return shuffle([answer, rest[0], rest[1]]);
    }

    function applyLevelClear(progressState, level) {
      if (progressState.clearedLevels.indexOf(level.id) !== -1) {
        return { progress: progressState, openWardrobe: false };
      }
      const ownedItemIds = progressState.ownedItemIds.slice();
      const reward = REWARDS[progressState.clearedLevels.length] || null;
      if (reward && ownedItemIds.indexOf(reward.id) === -1) ownedItemIds.push(reward.id);
      return {
        progress: {
          clearedLevels: progressState.clearedLevels.concat(level.id),
          ownedItemIds: ownedItemIds,
          equipped: { hair: progressState.equipped.hair, dress: progressState.equipped.dress },
          wardrobePending: !!reward
        },
        openWardrobe: !!reward
      };
    }

    function applyEquip(progressState, item) {
      const equipped = { hair: progressState.equipped.hair, dress: progressState.equipped.dress };
      equipped[item.slot] = item.id;
      return {
        clearedLevels: progressState.clearedLevels.slice(),
        ownedItemIds: progressState.ownedItemIds.slice(),
        equipped: equipped,
        wardrobePending: false
      };
    }

    function svg(body) {
      return '<svg viewBox="0 0 120 120" aria-hidden="true">' + body + "</svg>";
    }

    function princessMarkup(equipped) {
      const dress = equipped && equipped.dress && DRESS_ART[equipped.dress] ? equipped.dress : "default";
      const hair = equipped && equipped.hair && HAIR_ART[equipped.hair] ? HAIR_ART[equipped.hair] : "";
      return '<svg class="princess" viewBox="0 0 160 220" aria-hidden="true">' +
        DRESS_ART[dress] +
        '<ellipse cx="46" cy="132" rx="11" ry="16" fill="#fdba74"/>' +
        '<ellipse cx="114" cy="132" rx="11" ry="16" fill="#fdba74"/>' +
        '<ellipse cx="80" cy="78" rx="30" ry="26" fill="#7c4a32"/>' +
        '<circle cx="80" cy="74" r="24" fill="#fdba74"/>' +
        '<circle cx="72" cy="72" r="2.5" fill="#44403c"/>' +
        '<circle cx="88" cy="72" r="2.5" fill="#44403c"/>' +
        '<circle cx="66" cy="80" r="4" fill="#fb7185" opacity="0.45"/>' +
        '<circle cx="94" cy="80" r="4" fill="#fb7185" opacity="0.45"/>' +
        '<path d="M74 82 q6 6 12 0" stroke="#be185d" stroke-width="2" fill="none"/>' +
        hair +
        "</svg>";
    }

    function frame(inner) {
      const hidden = session.speechMissing ? "" : " hidden";
      return '<div class="stage">' + inner +
        '<p id="speech-note" class="note"' + hidden + ">这台设备读不出中文，仍然可以点字。</p></div>";
    }

    function fireworks() {
      if (progress.clearedLevels.length < LEVELS.length) return "";
      const colors = ["#fde68a", "#ffffff", "#f9a8d4", "#fbbf24"];
      let html = '<div class="fireworks" aria-hidden="true">';
      for (let i = 0; i < 10; i += 1) {
        html += '<span class="spark" style="left:' + (8 + i * 9) + "%;animation-delay:" + (i * 0.15).toFixed(2) + "s;background:" + colors[i % colors.length] + '"></span>';
      }
      return html + "</div>";
    }

    function burstPetals() {
      const stage = app.querySelector(".stage");
      if (!stage) return;
      const old = stage.querySelector(".confetti");
      if (old) old.parentNode.removeChild(old);
      const layer = document.createElement("div");
      layer.className = "confetti";
      layer.setAttribute("aria-hidden", "true");
      const bits = ["🌸", "🌼", "✨", "💗", "🌺", "⭐"];
      for (let i = 0; i < 32; i += 1) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.textContent = bits[i % bits.length];
        const angle = (Math.PI * 2 * i) / 32 + (Math.random() - 0.5) * 0.4;
        const dist = 120 + Math.random() * 260;
        petal.style.setProperty("--dx", Math.round(Math.cos(angle) * dist) + "px");
        petal.style.setProperty("--dy", Math.round(Math.sin(angle) * dist * 0.72 + 90) + "px");
        petal.style.setProperty("--rot", Math.round(Math.random() * 520 - 260) + "deg");
        petal.style.fontSize = Math.round(22 + Math.random() * 20) + "px";
        petal.style.animationDelay = (Math.random() * 0.08).toFixed(2) + "s";
        layer.appendChild(petal);
      }
      stage.appendChild(layer);
      setTimeout(function () {
        if (layer.parentNode) layer.parentNode.removeChild(layer);
      }, 2000);
    }

    function setSpeechNote() {
      const note = document.getElementById("speech-note");
      if (!note) return;
      note.hidden = !session.speechMissing;
    }

    function isChineseVoice(voice) {
      return /zh|chinese|中文|汉语/i.test((voice.lang || "") + " " + (voice.name || ""));
    }

    function voiceScore(voice) {
      const blob = ((voice.lang || "") + " " + (voice.name || "")).toLowerCase();
      let score = 0;
      if (/zh-cn|cmn-hans|simplified|普通话|大陆/.test(blob)) score += 30;
      else score += 10;
      if (/natural|neural|premium|enhanced|online|高质量|增强/.test(blob)) score += 80;
      if (/xiaoxiao|xiaoyi|xiaohan|xiaomeng|yunxi|yunyang|yunjian|tingting|ting-ting|婷婷/.test(blob)) score += 25;
      if (voice.localService) score += 8;
      return score;
    }

    function pickChineseVoice() {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices().filter(isChineseVoice);
      let best = null;
      let bestScore = -1;
      voices.forEach(function (voice) {
        const score = voiceScore(voice);
        if (score > bestScore) {
          bestScore = score;
          best = voice;
        }
      });
      return best;
    }

    function warmVoices() {
      if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
        session.speechMissing = true;
        return;
      }
      const check = function () {
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        if (!voices.some(isChineseVoice)) session.speechMissing = true;
        setSpeechNote();
      };
      window.speechSynthesis.addEventListener("voiceschanged", check);
      check();
    }

    function stopSpeech() {
      speechToken += 1;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speak(text, times) {
      const count = times || 1;
      const token = ++speechToken;
      return new Promise(function (resolve) {
        if (!window.speechSynthesis || typeof window.SpeechSynthesisUtterance !== "function") {
          session.speechMissing = true;
          setSpeechNote();
          resolve();
          return;
        }
        let settled = false;
        let left = count;
        const finish = function () {
          if (settled) return;
          settled = true;
          resolve();
        };
        const sayOnce = function () {
          if (settled || token !== speechToken) {
            finish();
            return;
          }
          if (left <= 0) {
            finish();
            return;
          }
          left -= 1;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = "zh-CN";
          utterance.rate = 0.9;
          utterance.pitch = 1;
          const voice = pickChineseVoice();
          if (voice) utterance.voice = voice;
          let moved = false;
          const next = function () {
            if (moved) return;
            moved = true;
            clearTimeout(utterTimer);
            if (settled || token !== speechToken) {
              finish();
              return;
            }
            if (left <= 0) finish();
            else setTimeout(sayOnce, 420);
          };
          const utterTimer = setTimeout(next, 1600);
          utterance.onend = next;
          utterance.onerror = function (event) {
            const reason = event && event.error;
            if (reason !== "interrupted" && reason !== "canceled") {
              session.speechMissing = true;
              setSpeechNote();
            }
            if (token !== speechToken) finish();
            else next();
          };
          try {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            window.speechSynthesis.speak(utterance);
          } catch (error) {
            session.speechMissing = true;
            setSpeechNote();
            finish();
          }
        };
        window.speechSynthesis.cancel();
        setTimeout(function () {
          if (token !== speechToken) {
            finish();
            return;
          }
          sayOnce();
        }, 60);
      });
    }

    function totalChars() {
      return LEVELS.reduce(function (sum, level) { return sum + level.chars.length; }, 0);
    }

    function levelsIn(categoryId) {
      return LEVELS.filter(function (level) { return level.categoryId === categoryId; });
    }

    function clueMarkup(item) {
      if (item.emoji) return '<div class="emoji-clue">' + item.emoji + "</div>";
      if (CHAR_ART[item.char]) return svg(CHAR_ART[item.char]);
      return '<div class="emoji-clue">' + item.char + "</div>";
    }

    function renderHome() {
      const seen = {};
      const cats = [];
      LEVELS.forEach(function (level) {
        if (seen[level.categoryId]) return;
        seen[level.categoryId] = true;
        const mine = levelsIn(level.categoryId);
        const done = mine.filter(function (item) {
          return progress.clearedLevels.indexOf(item.id) !== -1;
        }).length;
        cats.push({
          id: level.categoryId,
          name: level.categoryName,
          emoji: level.categoryEmoji,
          done: done,
          total: mine.length
        });
      });
      const doors = cats.map(function (cat) {
        const finished = cat.done === cat.total;
        return '<button type="button" class="door" data-action="category" data-id="' + cat.id + '">' +
          '<span class="door-emoji">' + cat.emoji + "</span>" +
          '<span class="door-name">' + cat.name + "</span>" +
          '<span class="door-meta">' + cat.done + "/" + cat.total + "关</span>" +
          '<span class="star">' + (finished ? "★" : "") + "</span></button>";
      }).join("");
      const allDone = progress.clearedLevels.length === LEVELS.length;
      app.innerHTML = frame(
        (allDone ? fireworks() : "") +
        '<div class="split">' +
          '<div class="hero-pane">' +
            "<h1>糖果城堡</h1>" +
            '<div class="hero">' + princessMarkup(progress.equipped) + "</div>" +
            '<p class="level-name">一共 ' + totalChars() + " 个字</p>" +
            (allDone ? '<p class="banner">全部过关啦</p>' : "") +
          "</div>" +
          '<div class="doors">' + doors + "</div>" +
        "</div>"
      );
    }

    function renderCategory() {
      const levels = levelsIn(session.categoryId);
      const title = levels.length ? levels[0].categoryName : "糖果城堡";
      const count = levels.reduce(function (sum, level) { return sum + level.chars.length; }, 0);
      const doors = levels.map(function (level, index) {
        const done = progress.clearedLevels.indexOf(level.id) !== -1;
        return '<button type="button" class="door" data-action="level" data-id="' + level.id + '">' +
          '<span class="door-emoji">' + (index + 1) + "</span>" +
          '<span class="door-name">第' + (index + 1) + "关</span>" +
          '<span class="door-meta">' + level.chars.length + "个字</span>" +
          '<span class="star">' + (done ? "★" : "") + "</span></button>";
      }).join("");
      app.innerHTML = frame(
        '<div class="quiz-top"><button type="button" class="back" data-action="home">回城堡</button>' +
        '<p class="level-name">' + title + " · " + count + " 个字</p></div>" +
        '<div class="doors">' + doors + "</div>"
      );
    }

    function renderQuiz() {
      const level = findLevel(session.levelId);
      const answer = session.queue[session.qIndex];
      const options = makeOptions(level, answer);
      const dots = session.queue.map(function (_, index) {
        const cls = index < session.qIndex ? "dot on" : index === session.qIndex ? "dot now" : "dot";
        return '<span class="' + cls + '"></span>';
      }).join("");
      const choices = options.map(function (item) {
        return '<button type="button" class="choice" data-action="pick" data-char="' + item.char + '">' + item.char + "</button>";
      }).join("");
      app.innerHTML = frame(
        '<div class="quiz-top"><button type="button" class="back" data-action="back">返回</button>' +
        '<p class="level-name">' + level.name + "</p>" +
        '<div class="dots">' + dots + "</div></div>" +
        '<div class="quiz-body">' +
          '<div class="picture-card">' + clueMarkup(answer) + "</div>" +
          '<div class="choices">' + choices + "</div>" +
        "</div>"
      );
      speak(answer.char, 3);
    }

    function renderWardrobe() {
      if (!progress.ownedItemIds.length) {
        progress.wardrobePending = false;
        session.screen = "home";
        renderHome();
        return;
      }
      const cards = progress.ownedItemIds.map(function (id) {
        const item = findItem(id);
        if (!item) return "";
        const worn = progress.equipped[item.slot] === item.id ? " worn" : "";
        return '<button type="button" class="item' + worn + '" data-action="wear" data-id="' + item.id + '">' +
          svg(ITEM_ART[item.id]) + "<span>" + item.name + "</span></button>";
      }).join("");
      app.innerHTML = frame(
        '<div class="split">' +
          '<div class="hero-pane">' +
            "<h1>衣橱</h1>" +
            '<div class="hero">' + princessMarkup(progress.equipped) + "</div>" +
            '<p class="banner">选一件穿上</p>' +
          "</div>" +
          '<div class="wardrobe-grid">' + cards + "</div>" +
        "</div>"
      );
    }

    function render() {
      if (session.screen === "quiz") renderQuiz();
      else if (session.screen === "wardrobe") renderWardrobe();
      else if (session.screen === "category") renderCategory();
      else renderHome();
    }

    function startLevel(id) {
      const level = findLevel(id);
      if (!level) return;
      session.quizEpoch += 1;
      session.levelId = id;
      session.queue = shuffle(level.chars);
      session.qIndex = 0;
      session.locked = false;
      session.screen = "quiz";
      render();
    }

    function backHome() {
      session.quizEpoch += 1;
      session.locked = false;
      session.screen = session.categoryId ? "category" : "home";
      session.levelId = null;
      session.queue = [];
      session.qIndex = 0;
      stopSpeech();
      render();
    }

    function finishLevel() {
      const level = findLevel(session.levelId);
      const result = applyLevelClear(progress, level);
      progress = result.progress;
      if (result.openWardrobe) saveProgress(progress);
      session.quizEpoch += 1;
      session.levelId = null;
      session.queue = [];
      session.qIndex = 0;
      session.locked = false;
      session.screen = result.openWardrobe ? "wardrobe" : (session.categoryId ? "category" : "home");
      render();
    }

    function onPick(char) {
      if (session.locked || session.screen !== "quiz") return;
      const answer = session.queue[session.qIndex];
      if (!answer) return;
      if (char !== answer.char) {
        const buttons = app.querySelectorAll(".choice");
        for (let i = 0; i < buttons.length; i += 1) {
          if (buttons[i].dataset.char === char) {
            buttons[i].classList.remove("shake");
            void buttons[i].offsetWidth;
            buttons[i].classList.add("shake");
          }
        }
        return;
      }
      session.locked = true;
      const choices = app.querySelectorAll(".choice");
      for (let i = 0; i < choices.length; i += 1) {
        if (choices[i].dataset.char === char) choices[i].classList.add("right");
      }
      const card = app.querySelector(".picture-card");
      if (card) card.classList.add("right");
      burstPetals();
      const epoch = session.quizEpoch;
      const levelId = session.levelId;
      speak(answer.char, 2).then(function () {
        if (epoch !== session.quizEpoch) return;
        if (session.screen !== "quiz" || session.levelId !== levelId) return;
        session.qIndex += 1;
        session.locked = false;
        if (session.qIndex >= session.queue.length) finishLevel();
        else render();
      });
    }

    function equipItem(id) {
      const item = findItem(id);
      if (!item || progress.ownedItemIds.indexOf(id) === -1) return;
      progress = applyEquip(progress, item);
      saveProgress(progress);
      session.screen = session.categoryId ? "category" : "home";
      render();
    }

    function openCategory(id) {
      session.categoryId = id;
      session.screen = "category";
      render();
    }

    function goHome() {
      session.quizEpoch += 1;
      session.locked = false;
      session.categoryId = null;
      session.levelId = null;
      session.queue = [];
      session.qIndex = 0;
      session.screen = "home";
      stopSpeech();
      render();
    }

    function onAppClick(event) {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "category") openCategory(target.dataset.id);
      if (action === "home") goHome();
      if (action === "level") startLevel(target.dataset.id);
      if (action === "back") backHome();
      if (action === "pick") onPick(target.dataset.char);
      if (action === "wear") equipItem(target.dataset.id);
    }

    function boot() {
      app = document.getElementById("app");
      progress = loadProgress();
      warmVoices();
      session.screen = progress.wardrobePending ? "wardrobe" : "home";
      let ignoreClickUntil = 0;
      let touchStart = null;
      app.addEventListener("touchstart", function (event) {
        if (!event.changedTouches || event.changedTouches.length !== 1) {
          touchStart = null;
          return;
        }
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      app.addEventListener("touchend", function (event) {
        if (!event.changedTouches || event.changedTouches.length !== 1) return;
        const touch = event.changedTouches[0];
        const moved = touchStart && Math.abs(touch.clientX - touchStart.x) + Math.abs(touch.clientY - touchStart.y) > 18;
        touchStart = null;
        if (moved) return;
        ignoreClickUntil = Date.now() + 700;
        event.preventDefault();
        onAppClick(event);
      }, { passive: false });
      app.addEventListener("click", function (event) {
        if (Date.now() < ignoreClickUntil) return;
        onAppClick(event);
      });
      render();
    }

    boot();
  </script>
</body>
</html>
